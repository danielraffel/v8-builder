# A review and a merge-queue build both run the pull request's (or the
# queue's) own copy of their workflow, so this one does nothing and holds no
# permissions. Its completion starts "Release path review" through
# workflow_run, which runs the default branch's definition. A queued copy that
# drops this workflow posts nothing, and the queue ejects the entry when the
# required status never arrives.
#
# On a review, the workflow_run's head_sha is the pull request's head commit,
# not the synthetic merge commit the workflow itself runs on: GitHub reports a
# pull-request-event run's head_sha as the head of the branch (checked against
# the runs of this trigger in Generous-Corp/vellum, where head_sha equals the
# pull request's head). The rule therefore judges and posts on the real head,
# so a changes-requested review replaces an earlier success.
name: Release path review trigger

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    branches: [main]

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Hand the event to Release path review
        run: 'true'
