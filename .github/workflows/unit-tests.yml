name: Unit tests

# Runs the seal-audit, release-gate, and release-asset-guard unit tests on
# every PR (it is a required check, so it must not be path-filtered). Pure
# Python; no V8 build.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'seal/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.shipyard/config.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: bash tools/run_tests.sh
