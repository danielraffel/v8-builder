name: Build failure watchdog

on:
  workflow_run:
    workflows: ["Build V8"]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  report:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.CODEX_TRIGGER_TOKEN || github.token }}

      - name: Create failure handoff
        env:
          GH_TOKEN: ${{ secrets.CODEX_TRIGGER_TOKEN || github.token }}
          RELEASE_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_NAME: ${{ github.event.workflow_run.name }}
          FAILED_DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          FAILED_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash .github/scripts/report-build-failure.sh
