name: Zizmor report

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zizmor report (Advanced Security disabled)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        continue-on-error: true
        with:
          advanced-security: false
          annotations: true
          persona: regular
          inputs: .
      - name: Zizmor report (no exit codes)
        continue-on-error: true
        run: uvx --from zizmor==1.32.0 zizmor --persona regular --no-exit-codes --format github .
