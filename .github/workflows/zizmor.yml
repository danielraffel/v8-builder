name: Zizmor report

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out workflows
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Zizmor report (Advanced Security disabled)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.8.1
        continue-on-error: true
        with:
          advanced-security: false
          annotations: true
          persona: regular
          inputs: .
      - name: Zizmor report (no exit codes)
        run: uvx --from zizmor==1.32.0 zizmor --persona regular --no-exit-codes --format github .
