# release-watch.yml — publish a new sealed-V8 sweep when Chromium's LKGR tuple changes.
#
# WHAT IT DOES: on a schedule (and on demand), it reads Chromium LKGR DEPS, extracts the
# co-tested Skia/V8/Dawn tuple, compares that tuple to the latest published v8-builder
# release manifest, and dispatches build-v8.yml only when one of those three SHAs changed.
#
# SCHEDULED RUNS PUBLISH BY DEFAULT: when a tuple change is detected from the weekly cron,
# the dispatched build uses skip_release=false. Manual runs still default to "hold" unless
# mode=publish is selected. Set V8_WATCH_AUTOPUBLISH=true to make manual/default runs publish
# too, or use force_version to build an exact legacy V8 tag outside LKGR mode.
#
# AUTOMATION ROUTING: release-watch dispatches Build V8 with force_github_runners=true so
# weekly publishing does not silently queue behind stale self-hosted runner variables.
# Direct/manual build-v8.yml runs can still opt into configured self-hosted runners.
#
# CADENCE: weekly. Chromium LKGR can advance many times per day, including unrelated DEPS
# rolls. This watcher intentionally ignores unrelated Chromium rolls and samples the latest
# Skia/V8/Dawn tuple once a week.

name: V8 release watch
on:
  schedule:
    - cron: '0 9 * * 1'        # Mondays 09:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual detected build: publish immediately or hold for review'
        type: choice
        default: hold
        options: [hold, publish]
      force_version:
        description: 'Optional legacy/manual V8 tag/version build; skips LKGR tuple detection'
        type: string
        required: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Detect current LKGR tuple vs latest release
        id: chk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FORCE="${{ inputs.force_version }}"
          if [ -n "$FORCE" ]; then
            {
              echo "mode=tag"
              echo "newer=yes"
              echo "latest=$FORCE"
            } >> "$GITHUB_OUTPUT"
            echo "forced legacy V8 tag/version $FORCE"
            exit 0
          fi

          python3 tools/lkgr_pin.py > lkgr-lock.json
          echo "Current Chromium LKGR lock:"
          python3 -m json.tool lkgr-lock.json
          {
            echo "mode=lkgr"
            echo "lock_b64=$(base64 -w0 lkgr-lock.json)"
          } >> "$GITHUB_OUTPUT"

          LAST_TAG="$(gh release list --repo "${{ github.repository }}" --limit 50 \
            --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt)|last|.tagName // ""')"
          echo "last=$LAST_TAG" >> "$GITHUB_OUTPUT"

          last_args=()
          metadata_args=()
          if [ -n "$LAST_TAG" ]; then
            mkdir -p last-release
            ASSET="$(gh release view "$LAST_TAG" --repo "${{ github.repository }}" \
              --json assets --jq '[.assets[].name | select(endswith(".zip"))][0] // ""')"
            if [ -n "$ASSET" ]; then
              gh release download "$LAST_TAG" --repo "${{ github.repository }}" \
                --pattern "$ASSET" -D last-release
              if unzip -p "last-release/$ASSET" manifest.json > last-manifest.json; then
                echo "Latest release manifest from $LAST_TAG / $ASSET:"
                python3 -m json.tool last-manifest.json
                last_args=(--last-manifest last-manifest.json)
              else
                echo "::warning::could not read manifest.json from $LAST_TAG / $ASSET; dispatching conservatively"
              fi
            else
              echo "::warning::latest release $LAST_TAG has no zip assets; dispatching conservatively"
            fi
            if gh release download "$LAST_TAG" --repo "${{ github.repository }}" \
                --pattern release-metadata.json -D last-release; then
              metadata_args=(--last-release-metadata last-release/release-metadata.json)
            else
              echo "::warning::latest release $LAST_TAG has no release metadata; dispatching conservatively"
            fi
          fi

          python3 tools/lkgr_decision.py \
            --current lkgr-lock.json \
            "${last_args[@]}" \
            "${metadata_args[@]}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch sweep + open tracking issue
        if: steps.chk.outputs.newer == 'yes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WATCH_MODE: ${{ steps.chk.outputs.mode }}
          FORCE_VERSION: ${{ steps.chk.outputs.latest }}
          LKGR_LOCK_B64: ${{ steps.chk.outputs.lock_b64 }}
          LKGR_V8: ${{ steps.chk.outputs.v8 }}
          LKGR_SKIA: ${{ steps.chk.outputs.skia }}
          LKGR_DAWN: ${{ steps.chk.outputs.dawn }}
          LKGR_CHROMIUM: ${{ steps.chk.outputs.chromium_revision }}
          LAST_TAG: ${{ steps.chk.outputs.last }}
          SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          MANUAL_MODE: ${{ inputs.mode }}
          AUTOPUBLISH: ${{ vars.V8_WATCH_AUTOPUBLISH }}
        run: |
          set -euo pipefail
          SKIA_RELEASE="${{ vars.V8_WATCH_SKIA_TAG }}"
          if [ -z "$SKIA_RELEASE" ]; then
            SKIA_RELEASE="$(gh release list --repo danielraffel/skia-builder --limit 50 \
              --exclude-drafts --exclude-pre-releases --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt)|last|.tagName')"
          fi
          [ -n "$SKIA_RELEASE" ] || { echo "::error::no published skia-builder release found"; exit 1; }
          if [ "$SCHEDULED" = "true" ] || [ "$MANUAL_MODE" = "publish" ] || [ "$AUTOPUBLISH" = "true" ]; then
            SKIP=false
            ACTION="build + PUBLISH"
          else
            SKIP=true
            ACTION="build + hold (review, then re-dispatch build-v8.yml with skip_release=false)"
          fi

          if [ "$WATCH_MODE" = "tag" ]; then
            TARGET_ID="v8-$FORCE_VERSION"
            gh workflow run build-v8.yml --repo "${{ github.repository }}" \
              -f platforms=all \
              -f release_target_id="$TARGET_ID" \
              -f v8_version="$FORCE_VERSION" \
              -f skia_release_tag="$SKIA_RELEASE" \
              -f skip_release="$SKIP" \
              -f force_github_runners=true
            TITLE="V8 $FORCE_VERSION forced — auto-sweep dispatched ($ACTION)"
            BODY="release-watch was manually forced to V8 $FORCE_VERSION. Dispatched build-v8.yml (all platforms + single-SHA gate) against Skia validation release $SKIA_RELEASE — mode: $ACTION."
          else
            TARGET_ID="chromium-lkgr-${LKGR_V8:0:12}"
            gh workflow run build-v8.yml --repo "${{ github.repository }}" \
              -f platforms=all \
              -f release_target_id="$TARGET_ID" \
              -f v8_revision="$LKGR_V8" \
              -f lkgr_lock_b64="$LKGR_LOCK_B64" \
              -f skia_release_tag="$SKIA_RELEASE" \
              -f skip_release="$SKIP" \
              -f force_github_runners=true
            TITLE="Chromium LKGR tuple changed — V8 ${LKGR_V8:0:12} dispatched ($ACTION)"
            BODY="$(printf '%s\n\nChromium: %s\nSkia: %s\nV8: %s\nDawn: %s' \
              "release-watch detected a new Chromium LKGR Skia/V8/Dawn tuple (last release: ${LAST_TAG:-<none>}). Dispatched build-v8.yml (all platforms + single-SHA gate) with V8 $LKGR_V8 against Skia validation release $SKIA_RELEASE — mode: $ACTION." \
              "$LKGR_CHROMIUM" "$LKGR_SKIA" "$LKGR_V8" "$LKGR_DAWN")"
          fi

          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" \
            --body "$BODY" || true

      - name: No new tuple
        if: steps.chk.outputs.newer == 'no'
        run: echo "No Skia/V8/Dawn tuple change since the latest release. Nothing to do."
